name: Build Windows

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Vet, Test & Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet and unit tests
        shell: pwsh
        run: |
          go vet ./...
          go test -count=1 -skip TestRefreshFromLiveAPI ./...

      - name: Build Windows executable
        shell: pwsh
        run: |
          go build -ldflags="-H windowsgui -s -w" -o hd2-strain-lab.exe .
          $hash = (Get-FileHash .\hd2-strain-lab.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  hd2-strain-lab.exe" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hd2-strain-lab-windows-amd64
          path: |
            hd2-strain-lab.exe
            SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish rolling Release (nightly)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")
          $recentCommits = (git log -n 10 --pretty=format:"- %h %s") -join "`n"
          @"
          Rolling pre-release built automatically from ``main``.

          - **Commit**: ``${{ github.sha }}`` ($shortSha)
          - **Built**: $buildTime

          ### Recent Commits
          $recentCommits
          "@ | Set-Content -Path .\nightly_notes.md -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin refs/tags/nightly

          $ErrorActionPreference = "Continue"
          gh release view nightly *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($exists) {
            gh release edit nightly `
              --title "HD2 Strain Lab Nightly (Rolling)" `
              --notes-file .\nightly_notes.md `
              --prerelease
            gh release upload nightly .\hd2-strain-lab.exe .\SHA256SUMS.txt --clobber
          } else {
            gh release create nightly `
              --title "HD2 Strain Lab Nightly (Rolling)" `
              --notes-file .\nightly_notes.md `
              --prerelease `
              .\hd2-strain-lab.exe `
              .\SHA256SUMS.txt
          }
